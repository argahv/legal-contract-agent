[project]
name = "legal-agent-backend"
version = "0.0.0"
requires-python = ">=3.12"
description = "FastAPI backend for Legal Agent (tooling metadata only)."

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]

[tool.ruff.format]
quote-style = "double"
